<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="auto">
  <defs>
    <filter id="flowShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0" />

  <!-- Step 1 -->
  <g transform="translate(30, 30)">
    <rect width="180" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#flowShadow)" />
    <circle cx="90" cy="55" r="26" fill="#ecfdf5" />
    <text x="90" y="62" font-size="28" text-anchor="middle">🛵</text>
    <text x="90" y="115" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">1. Sau Ca Chạy</text>
    <text x="90" y="140" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Chạy xong về nhà</text>
    <text x="90" y="158" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">hoặc nghỉ chân quán</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="225" y1="120" x2="255" y2="120" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <g transform="translate(270, 30)">
    <rect width="180" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#flowShadow)" />
    <circle cx="90" cy="55" r="26" fill="#e0f2fe" />
    <text x="90" y="62" font-size="28" text-anchor="middle">✍️</text>
    <text x="90" y="115" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">2. Bấm (+) Nhập Ca</text>
    <text x="90" y="140" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Cước App, Thưởng, Tip</text>
    <text x="90" y="158" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Tiền xăng, cơm nước</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="465" y1="120" x2="495" y2="120" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 3 (Highlight) -->
  <g transform="translate(510, 30)">
    <rect width="180" height="180" rx="16" fill="#ecfdf5" stroke="#00B14F" stroke-width="2.5" filter="url(#flowShadow)" />
    <circle cx="90" cy="55" r="26" fill="#00B14F" />
    <text x="90" y="62" font-size="28" text-anchor="middle">⚡</text>
    <text x="90" y="115" font-family="sans-serif" font-size="14" font-weight="900" fill="#065f46" text-anchor="middle">3. Tự Tính Lãi Ròng</text>
    <text x="90" y="140" font-family="sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Thu Gộp - Tổng Chi</text>
    <text x="90" y="158" font-family="sans-serif" font-size="11" font-weight="800" fill="#00B14F" text-anchor="middle">= Tiền Đút Túi</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="705" y1="120" x2="735" y2="120" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 4 -->
  <g transform="translate(750, 30)">
    <rect width="180" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#flowShadow)" />
    <circle cx="90" cy="55" r="26" fill="#fef3c7" />
    <text x="90" y="62" font-size="28" text-anchor="middle">🐷</text>
    <text x="90" y="115" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">4. Trích Tiết Kiệm</text>
    <text x="90" y="140" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Cất 50k - 100k/ngày</text>
    <text x="90" y="158" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Còn lại: Tiền mặt tiêu</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="945" y1="120" x2="975" y2="120" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 5 -->
  <g transform="translate(980, 20)">
    <circle cx="50" cy="110" r="38" fill="#10b981" filter="url(#flowShadow)" />
    <text x="50" y="105" font-size="22" text-anchor="middle">📊</text>
    <text x="50" y="125" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">XUẤT EXCEL</text>
  </g>
</svg>
