<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="auto">
  <defs>
    <filter id="shadowBox" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B14F" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" rx="16" fill="#f1f5f9" />

  <!-- App Header Bar -->
  <rect x="0" y="0" width="1200" height="64" rx="16" fill="#ffffff" filter="url(#shadowBox)" />
  <g transform="translate(30, 14)">
    <rect width="36" height="36" rx="10" fill="#00B14F" />
    <text x="18" y="24" font-size="20" text-anchor="middle" dominant-baseline="central">🛵</text>
    <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#0f172a">
      PhongDriver<tspan fill="#00B14F">Pay</tspan>
    </text>
  </g>

  <!-- Header Right (Driver profile & Actions) -->
  <g transform="translate(850, 16)">
    <rect width="160" height="32" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="80" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">
      🌕 25/9 ÂL • Ất Tỵ
    </text>

    <rect x="180" y="0" width="140" height="32" rx="8" fill="#00B14F" />
    <text x="250" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
      + Nhập Ca Hôm Nay
    </text>
  </g>

  <!-- Filter Bar -->
  <g transform="translate(30, 85)">
    <rect width="1140" height="50" rx="12" fill="#ffffff" filter="url(#shadowBox)" />
    <!-- Tabs -->
    <g transform="translate(15, 10)">
      <rect width="80" height="30" rx="8" fill="#00B14F" />
      <text x="40" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Tuần này</text>

      <rect x="90" width="80" height="30" rx="8" fill="#f8fafc" />
      <text x="130" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Hôm nay</text>

      <rect x="180" width="80" height="30" rx="8" fill="#f8fafc" />
      <text x="220" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Tháng này</text>

      <rect x="270" width="80" height="30" rx="8" fill="#f8fafc" />
      <text x="310" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Năm nay</text>

      <rect x="360" width="80" height="30" rx="8" fill="#f8fafc" />
      <text x="400" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Tùy chọn</text>
    </g>
    <!-- Right info -->
    <text x="1120" y="30" font-family="sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="end">
      📅 Khoảng thời gian: 28/10/2026 → 04/11/2026 (7 ca chạy)
    </text>
  </g>

  <!-- Target Progress Banner -->
  <g transform="translate(30, 150)">
    <rect width="1140" height="75" rx="14" fill="url(#primaryGrad)" filter="url(#shadowBox)" />
    <text x="30" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#d1fae5">🎯 MỤC TIÊU THU NHẬP (TUẦN NÀY)</text>
    <text x="30" y="60" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff">3.740.000 ₫ <tspan font-size="14" font-weight="400" fill="#a7f3d0">/ mục tiêu 3.500.000 ₫</tspan></text>
    <text x="1110" y="42" font-family="sans-serif" font-size="22" font-weight="900" fill="#fef08a" text-anchor="end">107% (Đạt chỉ tiêu! 🎉)</text>
    <!-- Progress bar -->
    <rect x="740" y="48" width="370" height="10" rx="5" fill="#064e3b" />
    <rect x="740" y="48" width="370" height="10" rx="5" fill="#facc15" />
  </g>

  <!-- 5 Core KPI Cards -->
  <g transform="translate(30, 240)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="216" height="95" rx="12" fill="#ffffff" filter="url(#shadowBox)" />
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">[1] THU NHẬP GỘP</text>
      <text x="16" y="60" font-family="sans-serif" font-size="18" font-weight="900" fill="#0f172a">4.580.000 ₫</text>
      <text x="16" y="80" font-family="sans-serif" font-size="10" fill="#94a3b8">Cước + Thưởng + Tip</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(231, 0)">
      <rect width="216" height="95" rx="12" fill="#ffffff" filter="url(#shadowBox)" />
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#e11d48">[2] TỔNG CHI PHÍ</text>
      <text x="16" y="60" font-family="sans-serif" font-size="18" font-weight="900" fill="#e11d48">840.000 ₫</text>
      <text x="16" y="80" font-family="sans-serif" font-size="10" fill="#94a3b8">Xăng + Cơm + Nhớt + Khác</text>
    </g>

    <!-- Card 3 (Highlight) -->
    <g transform="translate(462, 0)">
      <rect width="216" height="95" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadowBox)" />
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="800" fill="#065f46">★ [3] LÃI RÒNG ĐÚT TÚI</text>
      <text x="16" y="60" font-family="sans-serif" font-size="20" font-weight="900" fill="#00B14F">3.740.000 ₫</text>
      <text x="16" y="80" font-family="sans-serif" font-size="10" font-weight="600" fill="#047857">Đút túi = Gộp [1] - Chi [2]</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(693, 0)">
      <rect width="216" height="95" rx="12" fill="#ffffff" filter="url(#shadowBox)" />
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#d97706">[4] QUỸ TIẾT KIỆM</text>
      <text x="16" y="60" font-family="sans-serif" font-size="18" font-weight="900" fill="#d97706">700.000 ₫</text>
      <text x="16" y="80" font-family="sans-serif" font-size="10" fill="#94a3b8">Trích đều 100k/ngày</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(924, 0)">
      <rect width="216" height="95" rx="12" fill="#ffffff" filter="url(#shadowBox)" />
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#4f46e5">[5] TIỀN MẶT CÒN LẠI</text>
      <text x="16" y="60" font-family="sans-serif" font-size="18" font-weight="900" fill="#4f46e5">3.040.000 ₫</text>
      <text x="16" y="80" font-family="sans-serif" font-size="10" fill="#94a3b8">Tiêu dùng sau tiết kiệm</text>
    </g>
  </g>

  <!-- Performance Mini Bar -->
  <g transform="translate(30, 350)">
    <rect width="1140" height="45" rx="10" fill="#ffffff" filter="url(#shadowBox)" />
    <text x="60" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">
      ⏱ Lương TB: <tspan font-weight="800" fill="#00B14F">81.000 ₫/h</tspan>
    </text>
    <text x="340" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">
      📍 Doanh thu/Km: <tspan font-weight="800" fill="#2563eb">5.800 ₫/km</tspan>
    </text>
    <text x="620" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">
      🛵 Doanh thu/Cuốc: <tspan font-weight="800" fill="#7c3aed">39.000 ₫</tspan> (128 cuốc)
    </text>
    <text x="940" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">
      📈 Tỷ lệ Lãi ròng: <tspan font-weight="800" fill="#059669">81.7%</tspan>
    </text>
  </g>

  <!-- Data Table & Chart Split -->
  <g transform="translate(30, 410)">
    <!-- Data Table Container -->
    <rect width="1140" height="260" rx="14" fill="#ffffff" filter="url(#shadowBox)" />

    <!-- Table Header -->
    <path d="M 0 0 L 1140 0 L 1140 40 L 0 40 Z" fill="#f8fafc" rx="14" />
    <text x="30" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Ngày Dương</text>
    <text x="160" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Âm Lịch</text>
    <text x="310" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Giờ</text>
    <text x="380" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Cuốc</text>
    <text x="460" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Thu Gộp [1]</text>
    <text x="600" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">Tổng Chi [2]</text>
    <text x="740" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#00B14F">Lãi Ròng [3]</text>
    <text x="880" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#d97706">Tiết Kiệm [4]</text>
    <text x="1020" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#4f46e5">Tiền Mặt [5]</text>

    <!-- Row 1 -->
    <line x1="0" y1="40" x2="1140" y2="40" stroke="#f1f5f9" />
    <text x="30" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">2026-11-04</text>
    <text x="160" y="70" font-family="sans-serif" font-size="12" fill="#059669">25/9 ÂL</text>
    <text x="310" y="70" font-family="sans-serif" font-size="12" fill="#334155">8.5h</text>
    <text x="380" y="70" font-family="sans-serif" font-size="12" fill="#334155">18</text>
    <text x="460" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">775.000 ₫</text>
    <text x="600" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="#e11d48">160.000 ₫</text>
    <text x="740" y="70" font-family="sans-serif" font-size="14" font-weight="900" fill="#00B14F">615.000 ₫</text>
    <text x="880" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="#d97706">100.000 ₫</text>
    <text x="1020" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="#4f46e5">515.000 ₫</text>

    <!-- Row 2 -->
    <line x1="0" y1="90" x2="1140" y2="90" stroke="#f1f5f9" />
    <text x="30" y="120" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">2026-11-03</text>
    <text x="160" y="120" font-family="sans-serif" font-size="12" fill="#059669">24/9 ÂL</text>
    <text x="310" y="120" font-family="sans-serif" font-size="12" fill="#334155">9.0h</text>
    <text x="380" y="120" font-family="sans-serif" font-size="12" fill="#334155">21</text>
    <text x="460" y="120" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">930.000 ₫</text>
    <text x="600" y="120" font-family="sans-serif" font-size="13" font-weight="700" fill="#e11d48">285.000 ₫</text>
    <text x="740" y="120" font-family="sans-serif" font-size="14" font-weight="900" fill="#00B14F">645.000 ₫</text>
    <text x="880" y="120" font-family="sans-serif" font-size="13" font-weight="700" fill="#d97706">100.000 ₫</text>
    <text x="1020" y="120" font-family="sans-serif" font-size="13" font-weight="700" fill="#4f46e5">545.000 ₫</text>

    <!-- Row 3 -->
    <line x1="0" y1="140" x2="1140" y2="140" stroke="#f1f5f9" />
    <text x="30" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">2026-11-02</text>
    <text x="160" y="170" font-family="sans-serif" font-size="12" fill="#059669">23/9 ÂL</text>
    <text x="310" y="170" font-family="sans-serif" font-size="12" fill="#334155">7.5h</text>
    <text x="380" y="170" font-family="sans-serif" font-size="12" fill="#334155">16</text>
    <text x="460" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">625.000 ₫</text>
    <text x="600" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#e11d48">150.000 ₫</text>
    <text x="740" y="170" font-family="sans-serif" font-size="14" font-weight="900" fill="#00B14F">475.000 ₫</text>
    <text x="880" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#d97706">80.000 ₫</text>
    <text x="1020" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#4f46e5">395.000 ₫</text>

    <!-- Table Footer (Summary Row) -->
    <line x1="0" y1="200" x2="1140" y2="200" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="201" width="1140" height="58" fill="#f8fafc" rx="14" />
    <text x="30" y="235" font-family="sans-serif" font-size="13" font-weight="900" fill="#0f172a">TỔNG CỘNG</text>
    <text x="160" y="235" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b">7 ca chạy</text>
    <text x="310" y="235" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">58.0h</text>
    <text x="380" y="235" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">128</text>
    <text x="460" y="235" font-family="sans-serif" font-size="14" font-weight="900" fill="#0f172a">4.580.000 ₫</text>
    <text x="600" y="235" font-family="sans-serif" font-size="14" font-weight="900" fill="#e11d48">840.000 ₫</text>
    <text x="740" y="235" font-family="sans-serif" font-size="15" font-weight="900" fill="#00B14F">3.740.000 ₫</text>
    <text x="880" y="235" font-family="sans-serif" font-size="14" font-weight="900" fill="#d97706">700.000 ₫</text>
    <text x="1020" y="235" font-family="sans-serif" font-size="14" font-weight="900" fill="#4f46e5">3.040.000 ₫</text>
  </g>
</svg>
