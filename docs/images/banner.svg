<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#008239" />
      <stop offset="100%" stop-color="#00B14F" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" />

  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="180" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="950" cy="320" r="140" fill="#ffffff" fill-opacity="0.03" />

  <!-- App Icon Badge -->
  <g transform="translate(80, 85)">
    <rect width="100" height="100" rx="24" fill="#ffffff" filter="url(#shadow)" />
    <text x="50" y="65" font-size="54" text-anchor="middle" dominant-baseline="central">🛵</text>
  </g>

  <!-- Title & Subtitles -->
  <text x="210" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff">
    PhongDriver <tspan fill="#6ee7b7">Pay</tspan>
  </text>
  <text x="210" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#d1fae5">
    Ứng Dụng Quản Lý Doanh Thu, Chi Phí &amp; Tiết Kiệm Dành Cho Tài Xế Grab
  </text>

  <!-- Feature Cards Grid -->
  <g transform="translate(80, 230)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="100" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
      <text x="25" y="42" font-size="22">🌕</text>
      <text x="60" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Lịch Âm Dương</text>
      <text x="25" y="72" font-family="sans-serif" font-size="13" fill="#a7f3d0">Tự tính Mùng 1, Hôm Rằm, Lễ Tết theo chuẩn UTC+7</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(265, 0)">
      <rect width="240" height="100" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
      <text x="25" y="42" font-size="22">💰</text>
      <text x="60" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">5 Chỉ Số Cốt Lõi</text>
      <text x="25" y="72" font-family="sans-serif" font-size="13" fill="#a7f3d0">Thu gộp, Tổng chi, Lãi đút túi, Quỹ tiết kiệm, Tiền mặt</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(530, 0)">
      <rect width="240" height="100" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
      <text x="25" y="42" font-size="22">📊</text>
      <text x="60" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Xuất File Excel</text>
      <text x="25" y="72" font-family="sans-serif" font-size="13" fill="#a7f3d0">Xuất bảng chấm công .xlsx &amp; sao lưu JSON an toàn</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(795, 0)">
      <rect width="240" height="100" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
      <text x="25" y="42" font-size="22">📱</text>
      <text x="60" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">PWA Mobile-First</text>
      <text x="25" y="72" font-family="sans-serif" font-size="13" fill="#a7f3d0">Cài đặt trực tiếp lên điện thoại, dùng offline siêu mượt</text>
    </g>
  </g>
</svg>
